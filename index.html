<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gainers + LUDP Halts</title>
<style>
  :root{--bg:#0b0d10;--panel:#111418;--line:#1e2329;--tx:#e6e9ee;--mut:#8a93a0;--up:#2ecc71;--dn:#ff5c5c;--warn:#f5b301}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar h2{margin:0;font-size:14px;letter-spacing:.04em}
  .sp{flex:1}
  .bar label{color:var(--mut);font-size:12px}
  .bar select{width:130px !important}
  .bar input[type=number],.bar select{width:90px;background:#0b0d10;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  .meta{color:var(--mut);font-size:12px}
  .scroll{overflow:auto;flex:1}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;text-align:right;padding:8px 10px;font-size:12px;white-space:nowrap}
  td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  .sym{font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .nm{color:var(--mut);font-size:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  .up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.warn{color:var(--warn)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.up{background:#12301f}.pill.dn{background:#351616}
  .st-halted{color:var(--dn);font-weight:700}.st-resumed{color:var(--up);font-weight:700}
  .timer{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--warn)}
  tr.halted{background:#2a1214}
  .err{color:var(--dn);padding:10px 14px}
</style>
</head>
<body>

<section class="win">
  <div class="bar">
    <h2>GAINERS</h2>
    <label>Min price $ <input id="fp" type="number" value="1" step="0.1"></label>
    <label>Min move % <input id="fc" type="number" value="30"></label>
    <label>Min volume <input id="fv" type="number" value="300000"></label>
    <span class="sp"></span>
    <span class="meta" id="m1"></span>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>Symbol</th><th>Price</th><th>Change</th><th>Volume</th><th>Market Cap</th><th>LUDP halts</th><th>Status</th></tr></thead>
    <tbody id="b1"></tbody>
  </table><div class="err" id="e1"></div></div>
</section>

<section class="win">
  <div class="bar">
    <h2>HALTS · LUDP only</h2>
    <label><input id="all" type="checkbox"> show every LUDP halt (not only gainers)</label>
    <label>LULD band above $3
      <select id="band"><option value="0.05">5% (Tier 1)</option><option value="0.10">10% (Tier 2)</option></select>
    </label>
    <span class="sp"></span>
    <span class="meta" id="m2"></span>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>Symbol</th><th>Direction</th><th>Reason</th><th>Price</th><th>Halt Px</th><th>LULD Bands</th><th>Float</th><th>Volume</th><th>Halts</th><th>Halt Time (ET)</th><th>5-min timer</th><th>Resume (ET)</th><th>Status</th></tr></thead>
    <tbody id="b2"></tbody>
  </table><div class="err" id="e2"></div></div>
</section>

<script>
// ====== CONFIG (your Supabase project; anon key is public + read-only by RLS) ======
const SUPABASE_URL = "https://qqxnddhtrntwlzkigyyo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxeG5kZGh0cm50d2x6a2lneXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODU4MTksImV4cCI6MjEwOTU2MTgxOX0.dKBL2QK7WYCSNMCbvRxqh1rBh6LxRIaBnAcSozuxM8A";
const POLL_MS = 5000;
// ===================================================================================

const $ = (id) => document.getElementById(id);
const rest = (path) =>
  fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } })
    .then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.message || r.status); return j; });

const abbr = (n) => n == null ? "–" : n >= 1e12 ? (n/1e12).toFixed(2)+"T" : n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"K" : String(Math.round(n));
const px = (n) => n == null ? "–" : "$" + Number(n).toFixed(n < 1 ? 4 : 2);
const t12 = (t) => { if (!t) return "–"; const [h,m,s]=t.split(":"); const H=+h; return `${((H+11)%12)+1}:${m}:${String(parseInt(s||0)).padStart(2,"0")} ${H>=12?"PM":"AM"}`; };
const etDay = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
const luldPct = (p) => p > 3 ? +$("band").value : p >= 0.75 ? 0.20 : Math.min(0.15 / p, 0.75);

let G = [], H = [], INFO = {}, STATUS = {};

async function poll() {
  try {
    // show the latest trading day that has data (works on weekends too)
    const lastG = await rest("gainers?select=trade_day&order=trade_day.desc&limit=1");
    const day = lastG[0]?.trade_day || etDay();
    const lastH = await rest("ludp_halts?select=halt_day&order=halt_day.desc&limit=1");
    const hday = lastH[0]?.halt_day || day;
    [G, H, STATUS] = await Promise.all([
      rest(`gainers?trade_day=eq.${day}&select=*&order=change_pct.desc`),
      rest(`ludp_halts?halt_day=eq.${hday}&select=*&order=halt_epoch.desc`),
      rest("scrape_status?select=*").then((r) => Object.fromEntries(r.map((x) => [x.job, x]))),
    ]);
    const syms = [...new Set(H.map((h) => h.symbol))];
    INFO = syms.length ? Object.fromEntries((await rest(`symbol_info?symbol=in.(${syms.join(",")})&select=*`)).map((x) => [x.symbol, x])) : {};
    $("e1").textContent = $("e2").textContent = "";
    render();
  } catch (e) { $("e1").textContent = "Error: " + e.message; }
}

const ago = (s) => s ? Math.max(0, Math.round((Date.now() - Date.parse(s.last_run)) / 1000)) + "s ago" : "never";
function filtered() {
  const p = +$("fp").value, c = +$("fc").value, v = +$("fv").value;
  return G.filter((g) => g.price >= p && g.change_pct >= c && g.volume >= v);
}

function render() {
  const fg = filtered();
  const bySym = {};
  for (const h of H) (bySym[h.symbol] ||= []).push(h);
  const now = Date.now();
  const isHalted = (h) => !(h.resume_epoch && h.resume_epoch <= now);

  $("m1").textContent = `${fg.length} match / ${G.length} scanned · scraper ${ago(STATUS.gainers)}`;
  $("b1").innerHTML = fg.map((g) => {
    const hs = bySym[g.symbol] || [];
    const last = hs[0];
    const halted = last && isHalted(last);
    return `<tr class="${halted ? "halted" : ""}">
      <td><div class="sym">${g.symbol}</div><div class="nm">${g.name || ""}</div></td>
      <td>${px(g.price)}</td><td class="up">+${Number(g.change_pct).toFixed(2)}%</td>
      <td>${abbr(g.volume)}</td><td>${abbr(g.market_cap)}</td>
      <td class="${hs.length ? "warn" : "mut"}">${hs.length}</td>
      <td>${halted ? '<span class="st-halted">HALTED</span>' : '<span class="mut">trading</span>'}</td></tr>`;
  }).join("") || `<tr><td colspan="7" class="mut">No stocks match the filter.</td></tr>`;

  const gmap = Object.fromEntries(G.map((g) => [g.symbol, g]));
  const allowed = new Set(fg.map((g) => g.symbol));
  const syms = Object.keys(bySym).filter((s) => $("all").checked || allowed.has(s));
  const rows = syms.map((s) => ({ s, list: bySym[s], last: bySym[s][0] })).sort((a, b) => b.last.halt_epoch - a.last.halt_epoch);

  $("m2").textContent = `${rows.length} symbols · halts feed ${ago(STATUS.halts)}`;
  $("b2").innerHTML = rows.map(({ s, list, last }) => {
    const g = gmap[s], inf = INFO[s] || {};
    const price = g?.price ?? last.pause_price;
    const pct = price ? luldPct(price) : null;
    const halted = isHalted(last);
    const end = last.resume_epoch || last.timer_end_epoch;
    const left = halted && end ? Math.max(0, end - now) : 0;
    const mm = String(Math.floor(left/60000)).padStart(2,"0"), ss = String(Math.floor(left/1000)%60).padStart(2,"0");
    const timer = halted ? (left > 0 ? `<span class="timer">${mm}:${ss}</span>` : `<span class="timer">00:00 · awaiting resume</span>`) : `<span class="mut">–</span>`;
    const up = g ? g.change_pct >= 0 : (inf.prev_close && last.pause_price ? last.pause_price >= inf.prev_close : null);
    const dir = up == null ? "–" : `<span class="pill ${up ? "up" : "dn"}">${up ? "↗ UP" : "↘ DOWN"}</span>`;
    // Nasdaq/NYSE publish no free float: shares outstanding if present, else Nasdaq market cap / price
    const float = inf.shares_outstanding ?? (price && inf.market_cap ? inf.market_cap / price : (g && g.price ? g.market_cap / g.price : null));
    return `<tr class="${halted ? "halted" : ""}">
      <td><div class="sym">${s}</div><div class="nm">${last.name || ""} · ${last.market || ""}</div></td>
      <td>${dir}</td><td class="mut">${last.reason}</td>
      <td><b>${px(price)}</b></td><td class="mut">${px(last.pause_price)}</td>
      <td>${pct ? `<div class="up">↑ ${px(price*(1+pct))} <span class="mut">(${(pct*100).toFixed(1)}%)</span></div><div class="dn">↓ ${px(price*(1-pct))}</div>` : "–"}</td>
      <td>${abbr(float)}</td><td>${abbr(g?.volume)}</td>
      <td class="warn">${list.length}</td>
      <td>${t12(last.halt_time)}</td><td>${timer}</td>
      <td class="${halted ? "mut" : "up"}">${halted ? "–" : t12(last.resume_time)}</td>
      <td class="${halted ? "st-halted" : "st-resumed"}">${halted ? "HALTED" : "✓ RESUMED"}</td></tr>`;
  }).join("") || `<tr><td colspan="13" class="mut">No LUDP halts to show.</td></tr>`;
}

["fp","fc","fv","all","band"].forEach((id) => $(id).addEventListener("change", render));
poll();
setInterval(poll, POLL_MS);
setInterval(render, 1000); // live countdown
</script>
</body>
</html>
