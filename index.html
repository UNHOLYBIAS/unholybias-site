<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premarket Desk — unholybias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-panel: #111111;
    --bg-panel-2: #161616;
    --border: #262626;
    --border-red: rgba(248,113,113,0.28);
    --text: #d4d4d4;
    --text-dim: #6b6b6b;
    --text-faint: #464646;
    --amber: #f2a53d;
    --green: #4ade80;
    --red: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 24px 16px 64px;
    min-height: 100vh;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
  }

  h1::before { content: "// "; color: var(--text-dim); }

  #status { font-size: 11px; color: var(--text-dim); letter-spacing: 0.03em; }

  .clock-wrap { display: flex; align-items: baseline; gap: 14px; }
  #clock {
    font-size: 12px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
  }
  #clock .tz { color: var(--text-dim); font-size: 10px; margin-left: 4px; }

  footer#updated { font-variant-numeric: tabular-nums; }
  footer#updated.fresh { color: var(--green); }
  footer#updated.warn { color: var(--amber); }
  footer#updated.stale { color: var(--red); }

  .config-note {
    font-size: 11px;
    color: var(--amber);
    background: rgba(242,165,61,0.08);
    border: 1px solid rgba(242,165,61,0.25);
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 18px;
    display: none;
  }
  .config-note.show { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: left;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  thead th.num, tbody td.num { text-align: right; }

  tbody tr.mover-row { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr.mover-row:hover { background: var(--bg-panel); }
  tbody tr.mover-row.open { background: var(--bg-panel); }
  tbody td { padding: 10px 12px; }

  .symbol { color: var(--amber); font-weight: 600; }
  .caret { display:inline-block; width:10px; color: var(--text-dim); }
  .name { color: var(--text-dim); font-size: 12px; }
  .pct.pos { color: var(--green); }
  .pct.neg { color: var(--red); }

  .score-chip {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-left: 8px;
  }
  .score-chip.hi { color: var(--green); border-color: rgba(74,222,128,0.35); }
  .score-chip.mid { color: var(--amber); border-color: rgba(242,165,61,0.35); }
  .score-chip.lo { color: var(--red); border-color: rgba(248,113,113,0.35); }

  tr.detail-row td {
    background: var(--bg-panel);
    padding: 18px 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .detail-loading { color: var(--text-dim); font-size: 12px; padding: 6px 0; }
  .detail-error { color: var(--red); font-size: 12px; padding: 6px 0; }

  .detail-top {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 20px;
  }
  @media (max-width: 640px) { .detail-top { grid-template-columns: 1fr; } }

  .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
  .gauge-score { font-size: 24px; font-weight: 600; margin-top: -40px; }
  .gauge-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .badge {
    margin-top: 10px;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.high { color: var(--red); border-color: var(--red); background: rgba(248,113,113,0.08); }
  .badge.medium { color: var(--amber); border-color: var(--amber); background: rgba(242,165,61,0.08); }
  .badge.low { color: var(--text-dim); border-color: var(--border); background: transparent; }

  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
  .stat { background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; }
  .stat .k { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
  .stat .v { font-size: 14px; margin-top: 3px; }
  .stat .v.bull { color: var(--green); }
  .stat .v.bear { color: var(--red); }

  .verdict {
    font-size: 12px;
    padding: 9px 11px;
    border-radius: 4px;
    background: var(--bg-panel-2);
    border-left: 3px solid var(--amber);
    line-height: 1.5;
    margin-bottom: 4px;
  }

  .news-list { margin-top: 10px; }
  .news-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .news-item:last-child { border-bottom: none; }
  .news-item a { color: var(--text); text-decoration: none; }
  .news-item a:hover { color: var(--amber); }
  .news-meta { font-size: 10px; color: var(--text-faint); margin-top: 3px; }
  .sent-tag { font-size: 9px; padding: 1px 6px; border-radius: 10px; margin-right: 6px; text-transform: uppercase; }
  .sent-tag.positive { background: rgba(74,222,128,0.12); color: var(--green); }
  .sent-tag.negative { background: rgba(248,113,113,0.12); color: var(--red); }
  .sent-tag.neutral { background: rgba(107,107,107,0.15); color: var(--text-dim); }

  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  .panel-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 10px; }

  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .profile-grid .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .profile-grid .row .k { color: var(--text-dim); }
  .profile-grid .row .v { text-align: right; }

  .flags-box { border: 1px solid var(--border-red); background: rgba(248,113,113,0.05); border-radius: 6px; padding: 12px 14px; }
  .flags-box.clean { border-color: var(--border); background: var(--bg-panel-2); }
  .flags-box h3 { font-size: 11px; color: var(--red); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  .flags-box.clean h3 { color: var(--text-dim); }
  .flag-item { font-size: 12px; padding: 5px 0; color: #ffb3b3; display: flex; gap: 7px; }
  .flag-item .dot { color: var(--red); }
  .flags-box.clean .flag-item { color: var(--text-dim); }

  section.panel { margin-top: 28px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .panel-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  select#dateSelect {
    background: var(--bg-panel); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 11px; padding: 6px 9px; border-radius: 4px;
  }

  .rank { color: var(--text-faint); }
  .del-btn { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; }
  .del-btn:hover { color: var(--red); }

  .empty, .error { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 13px; }
  .error { color: var(--red); }

  footer { margin-top: 24px; text-align: center; font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; }

  @media (max-width: 640px) {
    .name { display: none; }
    thead th:nth-child(2), tbody td:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Premarket Desk</h1>
    <span class="clock-wrap">
      <span id="clock">--:--:--<span class="tz">ET</span></span>
      <span id="status">connecting…</span>
    </span>
  </header>

  <table>
    <thead>
      <tr>
        <th></th>
        <th>Symbol</th>
        <th>Name</th>
        <th class="num">% Chg</th>
        <th class="num">Price</th>
        <th class="num">Volume</th>
        <th class="num">Mkt Cap</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="empty" class="empty" style="display:none;">No data yet — waiting on the next scan.</div>
  <div id="error" class="error" style="display:none;"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>Leaderboard — top analyzed</h2>
      <select id="dateSelect"></select>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th><th>Ticker</th><th class="num">Gap%</th><th class="num">Rel Vol</th>
          <th class="num">Float</th><th class="num">Flags</th><th>Squeeze</th><th class="num">Score</th><th>Call</th><th></th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
    <div class="empty-state empty" id="lbEmpty" style="display:none;">Click movers above to analyze them — scored ones land here.</div>
  </section>

  <footer id="updated"></footer>
</div>

<script>
(function () {
  /* ================= CONFIG ================= */
  const SUPABASE_URL = "https://kwgkbqhcmimypcrfbqym.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_dPi7qx_l1OYRFhnddPv84Q_AA7bl1eI";

  // Massive/FMP calls now go through a proxy so the real API keys never
  // appear in this file. The proxy holds MASSIVE_API_KEY/FMP_API_KEY
  // server-side and forwards requests — see api_proxy.ts.
  const MASSIVE_BASE = "https://YOUR-API-PROXY.deno.dev/massive";
  const FMP_BASE = "https://YOUR-API-PROXY.deno.dev/fmp";
  const PROXY_SECRET = "REPLACE_WITH_PROXY_SECRET";

  // Telegram alerting moved server-side to tg_alert_cron.ts on Deno Deploy —
  // it no longer depends on this page being open. See that file for config.

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentList = "gainers";
  let currentRows = [];           // last loaded mover rows for the active tab
  let expandedSymbol = null;      // symbol currently expanded, or null
  let latestUpdatedAt = null;     // Date of the most recent updated_at seen from Supabase
  const RELAY_URL = "https://YOUR-DENO-DEPLOY-PROJECT.deno.dev/post-analysis";
  const RELAY_SECRET = "0b387eeb662010f22ecbcfbba3216640";
  const analysisCache = {};       // `${dateKey}:${symbol}` -> analysis object (in-memory this session)

  /* ================= Clock / freshness ================= */
  function renderClock() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'America/New_York' });
    document.getElementById('clock').innerHTML = `${timeStr}<span class="tz">ET</span>`;

    const updatedEl = document.getElementById('updated');
    if (!latestUpdatedAt) return;

    const secsAgo = Math.max(0, Math.round((now - latestUpdatedAt) / 1000));
    const agoStr = secsAgo < 60 ? `${secsAgo}s ago` : `${Math.floor(secsAgo / 60)}m ${secsAgo % 60}s ago`;
    const lastStr = latestUpdatedAt.toLocaleTimeString('en-US', { hour12: false, timeZone: 'America/New_York' });

    updatedEl.textContent = `last updated ${lastStr} ET — ${agoStr}`;
    updatedEl.classList.remove('fresh', 'warn', 'stale');
    updatedEl.classList.add(secsAgo < 60 ? 'fresh' : secsAgo < 120 ? 'warn' : 'stale');
  }

  /* ================= Formatting ================= */
  function fmtNum(n) {
    if (n === null || n === undefined) return "—";
    return Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(n);
  }
  function fmtFull(n) {
    if (n === null || n === undefined) return "—";
    return Number(n).toLocaleString("en-US");
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return "—";
    return "$" + fmtNum(n);
  }
  function fmtMarketCap(n) {
    if (n === null || n === undefined) return "—";
    n = Number(n);
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    return fmtFull(n);
  }
  function fmtPct(n) {
    if (n === null || n === undefined) return "—";
    const sign = n > 0 ? "+" : "";
    return `${sign}${Number(n).toFixed(2)}%`;
  }

  /* ================= Date / storage helpers ================= */
  function todayKeyET() {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {}; parts.forEach(p => map[p.type] = p.value);
    return `${map.year}-${map.month}-${map.day}`;
  }
  async function loadEntries(dateKey) {
    try {
      const res = await window.storage.get('watchlist:' + dateKey, false);
      return res ? JSON.parse(res.value) : [];
    } catch (e) { return []; }
  }
  async function saveEntries(dateKey, entries) {
    try { await window.storage.set('watchlist:' + dateKey, JSON.stringify(entries), false); }
    catch (e) { console.error('storage save failed', e); }
  }
  async function getDateIndex() {
    try {
      const res = await window.storage.get('watchlist:dates', false);
      return res ? JSON.parse(res.value) : [];
    } catch (e) { return []; }
  }
  async function addToDateIndex(dateKey) {
    const idx = await getDateIndex();
    if (!idx.includes(dateKey)) {
      idx.push(dateKey); idx.sort().reverse();
      try { await window.storage.set('watchlist:dates', JSON.stringify(idx), false); } catch (e) {}
      return idx;
    }
    return idx;
  }

  /* ================= Massive fetchers (via proxy) ================= */
  async function fetchFloat(ticker) {
    const url = `${MASSIVE_BASE}/stocks/vX/float?ticker=${encodeURIComponent(ticker)}`;
    const r = await fetch(url, { headers: { 'x-proxy-secret': PROXY_SECRET } });
    if (!r.ok) throw new Error('Float lookup failed (' + r.status + ')');
    const data = await r.json();
    const row = (data.results && data.results[0]) || null;
    return row ? row.free_float : null;
  }
  async function fetchNews(ticker) {
    const url = `${MASSIVE_BASE}/v2/reference/news?ticker=${encodeURIComponent(ticker)}&limit=5&order=desc&sort=published_utc`;
    const r = await fetch(url, { headers: { 'x-proxy-secret': PROXY_SECRET } });
    if (!r.ok) throw new Error('News lookup failed (' + r.status + ')');
    const data = await r.json();
    return data.results || [];
  }
  // Averages, over the last 60 sessions, the volume accumulated from premarket
  // open (04:00 ET) up to the SAME time-of-day as right now — so a 6:00 AM check
  // compares against each prior day's 4:00-6:00 volume, not a fixed 15-min slice.
  async function fetchAvgVolumeToNow(ticker) {
    const PREMARKET_START = '04:00';
    const to = new Date();
    const from = new Date(to.getTime() - 95 * 24 * 60 * 60 * 1000);
    const fmt = d => d.toISOString().slice(0, 10);

    // round current ET time down to the nearest completed 15-min bucket boundary,
    // so today's window lines up with the same bucket boundaries used historically
    const nowParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(to);
    const nowMap = {}; nowParts.forEach(p => nowMap[p.type] = p.value);
    const nowMinutes = parseInt(nowMap.hour, 10) * 60 + parseInt(nowMap.minute, 10);
    const flooredMinutes = Math.floor(nowMinutes / 15) * 15;
    const endHM = String(Math.floor(flooredMinutes / 60)).padStart(2, '0') + ':' + String(flooredMinutes % 60).padStart(2, '0');

    const url = `${MASSIVE_BASE}/v2/aggs/ticker/${encodeURIComponent(ticker)}/range/15/minute/${fmt(from)}/${fmt(to)}?adjusted=true&sort=asc&limit=5000`;
    const r = await fetch(url, { headers: { 'x-proxy-secret': PROXY_SECRET } });
    if (!r.ok) throw new Error('Aggregates lookup failed (' + r.status + ')');
    const data = await r.json();
    const bars = data.results || [];
    const byDay = {};
    for (const bar of bars) {
      const d = new Date(bar.t);
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
      const map = {}; parts.forEach(p => map[p.type] = p.value);
      const dayKey = `${map.year}-${map.month}-${map.day}`;
      const hm = `${map.hour}:${map.minute}`;
      // only count bars inside today's elapsed window (04:00 -> endHM) on each historical day
      if (hm >= PREMARKET_START && hm < endHM) {
        if (!byDay[dayKey]) byDay[dayKey] = 0;
        byDay[dayKey] += bar.v;
      }
    }
    const todayKey = fmt(to);
    delete byDay[todayKey]; // never let today leak into its own historical average

    const days = Object.keys(byDay).sort().reverse().slice(0, 60);
    if (days.length === 0) return null;
    const total = days.reduce((sum, k) => sum + byDay[k], 0);
    return total / days.length;
  }
  async function fetchLastSplit(ticker) {
    const url = `${MASSIVE_BASE}/v3/reference/splits?ticker=${encodeURIComponent(ticker)}&limit=5&sort=execution_date.desc`;
    const r = await fetch(url, { headers: { 'x-proxy-secret': PROXY_SECRET } });
    if (!r.ok) return null;
    const data = await r.json();
    const rows = data.results || [];
    if (rows.length === 0) return null;
    const last = rows[0];
    const isReverse = last.split_to < last.split_from;
    const monthsAgo = (Date.now() - new Date(last.execution_date).getTime()) / (1000 * 60 * 60 * 24 * 30);
    return { date: last.execution_date, from: last.split_from, to: last.split_to, isReverse, recentReverse: isReverse && monthsAgo <= 18 };
  }
  async function fetchProfile(ticker) {
    const url = `${FMP_BASE}/profile?symbol=${encodeURIComponent(ticker)}`;
    const r = await fetch(url, { headers: { 'x-proxy-secret': PROXY_SECRET } });
    if (!r.ok) throw new Error('Profile lookup failed (' + r.status + ')');
    const data = await r.json();
    return (Array.isArray(data) && data[0]) ? data[0] : null;
  }

  /* ================= Scoring ================= */
  function computeScore({ gapPct, relVol, float, news }) {
    const absGap = Math.abs(gapPct || 0);
    const gapScore = Math.min(absGap / 50, 1) * 3;
    const rv = relVol || 0;
    const relVolScore = Math.min(rv / 5, 1) * 3;
    let floatScore = 0;
    if (float != null) {
      if (float < 10_000_000) floatScore = 2;
      else if (float < 20_000_000) floatScore = 1.5;
      else if (float < 50_000_000) floatScore = 1;
      else if (float < 100_000_000) floatScore = 0.5;
    }
    let newsScore = 0;
    const recentNews = (news || []).filter(n => {
      const days = (Date.now() - new Date(n.published_utc).getTime()) / (1000 * 60 * 60 * 24);
      return days <= 3;
    });
    if (recentNews.length > 0) {
      newsScore += 1;
      const strongSentiment = recentNews.some(n => (n.insights || []).some(i => i.sentiment === 'positive' || i.sentiment === 'negative'));
      if (strongSentiment) newsScore += 1;
    }
    return Math.round((gapScore + relVolScore + floatScore + newsScore) * 10) / 10;
  }
  function squeezeRisk({ relVol, float, gapPct }) {
    const conditions = [
      float != null && float < 20_000_000,
      (relVol || 0) > 3,
      Math.abs(gapPct || 0) > 15
    ].filter(Boolean).length;
    if (conditions >= 3) return 'high';
    if (conditions === 2) return 'medium';
    return 'low';
  }
  function verdictFor(score, squeeze) {
    if (score >= 7) return `Strong watchlist candidate. Score ${score}/10 — gap, relative volume, float and news are aligned.` + (squeeze === 'high' ? ' Squeeze risk is high — size entries carefully.' : '');
    if (score >= 4) return `Marginal. Score ${score}/10 — some signals present but not enough to lean hard either way.`;
    return `Weak setup. Score ${score}/10 — not enough confluence of gap, volume, float and catalyst yet.`;
  }
  const HIGH_RISK_COUNTRIES = new Set(['CN', 'HK']);
  function computeRedFlags({ profile, float, split }) {
    const flags = [];
    if (profile && HIGH_RISK_COUNTRIES.has((profile.country || '').toUpperCase())) {
      flags.push('China/Hong Kong based — heightened fraud / VIE structure risk');
    }
    if (profile && profile.marketCap != null && profile.marketCap < 300_000_000) {
      flags.push('Micro-cap (<$300M market cap)');
    }
    if (float != null && float < 5_000_000) {
      flags.push('Low float (<5M) — squeeze-prone, also prone to violent reversals');
    }
    if (split && split.recentReverse) {
      flags.push(`Reverse split within the last 18 months (${split.from}:${split.to} on ${split.date}) — dilution/going-concern pattern`);
    }
    return flags;
  }

  /* ================= Gauge SVG ================= */
  function gaugeSvg(score) {
    const pct = Math.max(0, Math.min(score, 10)) / 10;
    const angle = Math.PI * (1 - pct);
    const cx = 75, cy = 75, r = 60;
    const x = cx + r * Math.cos(angle);
    const y = cy - r * Math.sin(angle);
    let color = 'var(--text-dim)';
    if (score >= 7) color = 'var(--green)';
    else if (score >= 4) color = 'var(--amber)';
    else color = 'var(--red)';
    return `<svg width="150" height="85" viewBox="0 0 150 85">
      <path d="M 15 75 A 60 60 0 0 1 135 75" fill="none" stroke="#262626" stroke-width="9" stroke-linecap="round"/>
      <path d="M 15 75 A 60 60 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${color}"/>
    </svg>`;
  }
  function scoreChipClass(score) {
    if (score >= 7) return 'hi';
    if (score >= 4) return 'mid';
    return 'lo';
  }

  /* ================= Analysis ================= */
  async function analyzeStock(row) {
    const ticker = row.symbol;
    const gapPct = Number(row.pct_change);
    const manualVol = Number(row.volume);

    const [float, news, avgVol, profile, split] = await Promise.all([
      fetchFloat(ticker).catch(() => null),
      fetchNews(ticker).catch(() => []),
      fetchAvgVolumeToNow(ticker).catch(() => null),
      fetchProfile(ticker).catch(() => null),
      fetchLastSplit(ticker).catch(() => null)
    ]);

    const relVol = (avgVol && avgVol > 0) ? manualVol / avgVol : null;
    const score = computeScore({ gapPct, relVol, float, news });
    const squeeze = squeezeRisk({ relVol, float, gapPct });
    const flags = computeRedFlags({ profile, float, split });

    return { ticker, gapPct, manualVol, float, avgVol, relVol, news, score, squeeze, profile, split, flags, listType: currentList };
  }

  function detailHtml(d) {
    const p = d.profile || {};
    const country = p.country || '—';
    const industry = p.industry || p.sector || '—';
    const exchange = p.exchangeShortName || p.exchange || '—';
    const splitLine = d.split ? `${d.split.from}:${d.split.to} on ${d.split.date}${d.split.isReverse ? ' (reverse)' : ''}` : 'None on record';

    let newsHtml;
    if (!d.news || d.news.length === 0) {
      newsHtml = '<div class="news-item" style="color:var(--text-faint);">No recent news found.</div>';
    } else {
      newsHtml = d.news.slice(0, 5).map(n => {
        const sentiment = (n.insights && n.insights[0] && n.insights[0].sentiment) || 'neutral';
        const date = new Date(n.published_utc).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `<div class="news-item">
          <span class="sent-tag ${sentiment}">${sentiment}</span>
          <a href="${n.article_url}" target="_blank" rel="noopener">${n.title}</a>
          <div class="news-meta">${(n.publisher && n.publisher.name) || ''} · ${date}</div>
        </div>`;
      }).join('');
    }

    const flagsHtml = d.flags.length === 0
      ? `<div class="flags-box clean"><h3>No flags triggered</h3><div class="flag-item">Nothing in country, market cap, float or split history tripped a flag. Still do your own diligence.</div></div>`
      : `<div class="flags-box"><h3>⚠ Red flags</h3>${d.flags.map(f => `<div class="flag-item"><span class="dot">▲</span>${f}</div>`).join('')}</div>`;

    return `
      <div class="detail-top">
        <div class="gauge-wrap">
          ${gaugeSvg(d.score)}
          <div class="gauge-score">${d.score}</div>
          <div class="gauge-label">Watchlist score</div>
          <div class="badge ${d.squeeze}">Squeeze risk: ${d.squeeze}</div>
        </div>
        <div>
          <div class="stat-grid">
            <div class="stat"><div class="k">Float</div><div class="v">${fmtNum(d.float)}</div></div>
            <div class="stat"><div class="k">60d avg vol (4:00→now)</div><div class="v">${fmtNum(d.avgVol)}</div></div>
            <div class="stat"><div class="k">Relative volume</div><div class="v ${d.relVol != null && d.relVol >= 2 ? 'bull' : ''}">${d.relVol != null ? d.relVol.toFixed(2) + 'x' : '—'}</div></div>
          </div>
          <div class="verdict">${verdictFor(d.score, d.squeeze)}</div>
          <div class="news-list">${newsHtml}</div>
        </div>
      </div>
      <div class="two-col">
        <div>
          <div class="panel-label">Company profile</div>
          <div class="profile-grid">
            <div class="row"><span class="k">Company</span><span class="v">${p.companyName || d.ticker}</span></div>
            <div class="row"><span class="k">Industry</span><span class="v">${industry}</span></div>
            <div class="row"><span class="k">Country</span><span class="v">${country}</span></div>
            <div class="row"><span class="k">Exchange</span><span class="v">${exchange}</span></div>
            <div class="row"><span class="k">Market cap</span><span class="v">${fmtMoney(p.marketCap)}</span></div>
            <div class="row"><span class="k">Float</span><span class="v">${fmtNum(d.float)}</span></div>
            <div class="row"><span class="k">60d avg vol (4:00→now)</span><span class="v">${fmtNum(d.avgVol)}</span></div>
            <div class="row"><span class="k">Last split</span><span class="v">${splitLine}</span></div>
          </div>
        </div>
        <div>
          <div class="panel-label">Red flags</div>
          ${flagsHtml}
        </div>
      </div>
    `;
  }

  /* ================= Movers table ================= */
  async function loadMovers(listType) {
    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");
    const emptyEl = document.getElementById("empty");
    const errorEl = document.getElementById("error");
    const updatedEl = document.getElementById("updated");

    statusEl.textContent = "loading…";
    errorEl.style.display = "none";
    emptyEl.style.display = "none";

    const { data, error } = await supabase
      .from("premarket_movers")
      .select("*")
      .eq("list_type", listType)
      .order("pct_change", { ascending: listType === "losers" });

    if (error) {
      statusEl.textContent = "error";
      errorEl.textContent = "Couldn't load data: " + error.message;
      errorEl.style.display = "block";
      rowsEl.innerHTML = "";
      currentRows = [];
      return;
    }

    currentRows = data || [];
    // Telegram alerts now fire server-side via the Deno cron job (tg_alert_cron.ts),
    // independent of this page being open — no client-side call needed here anymore.

    if (currentRows.length === 0) {
      rowsEl.innerHTML = "";
      emptyEl.style.display = "block";
      statusEl.textContent = "live";
      return;
    }

    renderMoversTable();
    statusEl.textContent = "live";

    const latest = currentRows.reduce((a, b) => new Date(a.updated_at) > new Date(b.updated_at) ? a : b);
    latestUpdatedAt = new Date(latest.updated_at);
    renderClock();
  }

  function renderMoversTable() {
    const rowsEl = document.getElementById("rows");
    const dateKey = todayKeyET();
    rowsEl.innerHTML = currentRows.map(r => {
      const cacheKey = `${dateKey}:${r.symbol}`;
      const cached = analysisCache[cacheKey];
      const isOpen = expandedSymbol === r.symbol;
      const chip = cached ? `<span class="score-chip ${scoreChipClass(cached.score)}">${cached.score}</span>` : '';
      const rowHtml = `
        <tr class="mover-row ${isOpen ? 'open' : ''}" data-symbol="${r.symbol}">
          <td><span class="caret">${isOpen ? '▾' : '▸'}</span></td>
          <td class="symbol">${r.symbol}${chip}</td>
          <td class="name">${r.name ?? ""}</td>
          <td class="num pct ${r.pct_change >= 0 ? "pos" : "neg"}">${fmtPct(r.pct_change)}</td>
          <td class="num">${r.price ?? "—"}</td>
          <td class="num">${fmtFull(r.volume)}</td>
          <td class="num">${fmtMarketCap(r.market_cap)}</td>
        </tr>`;
      let detailRowHtml = '';
      if (isOpen) {
        let body;
        if (cached) body = detailHtml(cached);
        else body = `<div class="detail-loading" id="loading-${r.symbol}">Pulling float, profile, news, splits and 60-day average volume for ${r.symbol}…</div>`;
        detailRowHtml = `<tr class="detail-row"><td colspan="7">${body}</td></tr>`;
      }
      return rowHtml + detailRowHtml;
    }).join('');

    rowsEl.querySelectorAll('.mover-row').forEach(tr => {
      tr.addEventListener('click', () => onRowClick(tr.dataset.symbol));
    });

    // if a row is open but not yet cached/fetched, kick off the fetch
    if (expandedSymbol) {
      const dateKey2 = todayKeyET();
      const ck = `${dateKey2}:${expandedSymbol}`;
      if (!analysisCache[ck]) {
        const row = currentRows.find(r => r.symbol === expandedSymbol);
        if (row) runAnalysis(row);
      }
    }
  }

  async function onRowClick(symbol) {
    if (expandedSymbol === symbol) {
      expandedSymbol = null;
    } else {
      expandedSymbol = symbol;
    }
    renderMoversTable();
  }

  /* ================= Telegram: post analysis card ================= */
  function analysisToTelegramText(d) {
    const p = d.profile || {};
    const country = p.country || '—';
    const industry = p.industry || p.sector || '—';
    const exchange = p.exchangeShortName || p.exchange || '—';
    const splitLine = d.split ? `${d.split.from}:${d.split.to} on ${d.split.date}${d.split.isReverse ? ' (reverse)' : ''}` : 'None on record';
    const flagsLine = d.flags.length === 0 ? 'None triggered' : d.flags.map(f => `• ${f}`).join('\n');

    return (
      `📋 ${d.ticker} — ${p.companyName || d.ticker}\n` +
      `Score: ${d.score}/10 | Squeeze: ${d.squeeze}\n` +
      `Gap: ${fmtPct(d.gapPct)} | RelVol: ${d.relVol != null ? d.relVol.toFixed(2) + 'x' : '—'}\n\n` +
      `Industry: ${industry}\n` +
      `Country: ${country}\n` +
      `Exchange: ${exchange}\n` +
      `Market cap: ${fmtMoney(p.marketCap)}\n` +
      `Float: ${fmtNum(d.float)}\n` +
      `60d avg vol: ${fmtNum(d.avgVol)}\n` +
      `Last split: ${splitLine}\n\n` +
      `Red flags:\n${flagsLine}`
    );
  }

  async function postAnalysisToTelegram(d) {
    try {
      const r = await fetch(RELAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-alert-secret': RELAY_SECRET },
        body: JSON.stringify({ text: analysisToTelegramText(d) })
      });
      if (!r.ok) console.error('Telegram relay failed', r.status, await r.text());
    } catch (e) {
      console.error('Telegram relay error', e);
    }
  }

  async function runAnalysis(row) {
    const dateKey = todayKeyET();
    const cacheKey = `${dateKey}:${row.symbol}`;
    try {
      const analysis = await analyzeStock(row);
      analysisCache[cacheKey] = analysis;
      postAnalysisToTelegram(analysis); // fire-and-forget, don't block rendering

      // persist into today's leaderboard
      const entries = await loadEntries(dateKey);
      const filtered = entries.filter(e => e.ticker !== row.symbol);
      filtered.push({
        ticker: row.symbol, gapPct: analysis.gapPct, manualVol: analysis.manualVol,
        float: analysis.float, avgVol: analysis.avgVol, relVol: analysis.relVol,
        score: analysis.score, squeeze: analysis.squeeze, flagCount: analysis.flags.length,
        listType: analysis.listType, ts: Date.now()
      });
      await saveEntries(dateKey, filtered);
      await addToDateIndex(dateKey);
      await refreshDateSelect(dateKey);
      await renderLeaderboard(dateKey);

      if (expandedSymbol === row.symbol) renderMoversTable();
    } catch (err) {
      const loadingEl = document.getElementById('loading-' + row.symbol);
      if (loadingEl) {
        loadingEl.outerHTML = `<div class="detail-error">Error analyzing ${row.symbol}: ${err.message}</div>`;
      }
    }
  }

  /* ================= Leaderboard ================= */
  async function renderLeaderboard(dateKey) {
    const entries = await loadEntries(dateKey);
    const body = document.getElementById('leaderboardBody');
    const empty = document.getElementById('lbEmpty');
    entries.sort((a, b) => b.score - a.score);

    if (entries.length === 0) {
      body.innerHTML = ''; empty.style.display = 'block'; return;
    }
    empty.style.display = 'none';

    body.innerHTML = entries.map((e, i) => {
      const call = e.score >= 7 ? 'Watch' : e.score >= 4 ? 'Marginal' : 'Skip';
      const callColor = e.score >= 7 ? 'var(--green)' : e.score >= 4 ? 'var(--amber)' : 'var(--text-faint)';
      return `<tr>
        <td class="rank">${i + 1}</td>
        <td class="symbol">${e.ticker}</td>
        <td class="num pct ${e.gapPct >= 0 ? 'pos' : 'neg'}">${fmtPct(e.gapPct)}</td>
        <td class="num">${e.relVol != null ? e.relVol.toFixed(2) + 'x' : '—'}</td>
        <td class="num">${fmtNum(e.float)}</td>
        <td class="num" style="color:${e.flagCount > 0 ? 'var(--red)' : 'var(--text-faint)'}">${e.flagCount > 0 ? e.flagCount : '—'}</td>
        <td style="text-transform:capitalize;color:${e.squeeze === 'high' ? 'var(--red)' : e.squeeze === 'medium' ? 'var(--amber)' : 'var(--text-dim)'}">${e.squeeze}</td>
        <td class="num">${e.score}</td>
        <td style="color:${callColor};">${call}</td>
        <td><button class="del-btn" data-ticker="${e.ticker}" title="Remove">✕</button></td>
      </tr>`;
    }).join('');

    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const t = btn.getAttribute('data-ticker');
        const current = await loadEntries(dateKey);
        await saveEntries(dateKey, current.filter(e => e.ticker !== t));
        renderLeaderboard(dateKey);
      });
    });
  }

  async function refreshDateSelect(selectKey) {
    const idx = await getDateIndex();
    const sel = document.getElementById('dateSelect');
    const prevVal = selectKey || sel.value || todayKeyET();
    sel.innerHTML = idx.length ? idx.map(d => `<option value="${d}">${d}</option>`).join('') : `<option value="${todayKeyET()}">${todayKeyET()}</option>`;
    sel.value = prevVal;
  }
  document.getElementById('dateSelect').addEventListener('change', e => {
    renderLeaderboard(e.target.value);
  });

  /* ================= Init ================= */
  (async function init() {
    const today = todayKeyET();
    await addToDateIndex(today);
    await refreshDateSelect(today);
    await renderLeaderboard(today);
    await loadMovers(currentList);
    setInterval(() => loadMovers(currentList), 30000);
    renderClock();
    setInterval(renderClock, 1000);
  })();
})();
</script>
</body>
</html>
