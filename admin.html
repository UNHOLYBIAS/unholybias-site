<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — @unholybias</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --void:#0a0a0c; --panel:#141417; --panel-2:#1b1b1f; --line:#2a2a2f;
    --amber:#f5a623; --amber-dim:#8a611a; --ink:#e8e6e1; --dim:#6b7280;
    --bull:#3ecf8e; --bear:#e5484d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--void); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;}
  a{color:var(--amber);}
  .wrap{max-width:900px; margin:0 auto; padding:56px 20px 100px;}
  .logo{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:15px; margin-bottom:40px;}
  .logo span{color:var(--amber);}
  h1{font-family:'IBM Plex Mono', monospace; font-size:22px; margin-bottom:24px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:28px; margin-bottom:28px;}
  label{display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); letter-spacing:0.05em; text-transform:uppercase; margin-bottom:6px; margin-top:16px;}
  label:first-child{margin-top:0;}
  input, select, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:10px 12px; border-radius:2px; font-family:'IBM Plex Sans', sans-serif; font-size:14px;
  }
  textarea{resize:vertical; min-height:60px;}
  input:focus, select:focus, textarea:focus{outline:1px solid var(--amber); border-color:var(--amber);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media (max-width:600px){ .row2, .row3{grid-template-columns:1fr;} }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:13px; padding:12px 22px; border-radius:2px;
    background:var(--amber); color:var(--void); font-weight:600; border:none; cursor:pointer; margin-top:20px;
  }
  .btn:hover{background:#ffb84d;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:400;}
  .btn-danger{background:transparent; border:1px solid var(--bear); color:var(--bear); font-weight:400; padding:6px 12px; font-size:12px; margin-top:0;}
  .rr-preview{
    margin-top:16px; padding:12px 16px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--dim);
  }
  .rr-preview b{color:var(--amber);}
  .msg{font-family:'IBM Plex Mono', monospace; font-size:12px; margin-top:12px;}
  .msg.ok{color:var(--bull);}
  .msg.err{color:var(--bear);}
  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em;}
  .pill{font-family:'IBM Plex Mono', monospace; font-size:11px; padding:2px 8px; border-radius:2px;}
  .pill.long{color:var(--bull); border:1px solid rgba(62,207,142,.35); background:rgba(62,207,142,.08);}
  .pill.short{color:var(--bear); border:1px solid rgba(229,72,77,.35); background:rgba(229,72,77,.08);}
  #app{display:none;}
  #loginBox{max-width:380px; margin:120px auto 0;}
</style>
</head>
<body>

<div class="wrap" id="loginWrap">
  <div class="logo">@unholy<span>bias</span> · admin</div>
  <div class="panel" id="loginBox">
    <h1 style="font-size:16px;">Sign in</h1>
    <label>Email</label>
    <input type="email" id="loginEmail">
    <label>Password</label>
    <input type="password" id="loginPass">
    <button class="btn" onclick="doLogin()">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="logo">@unholy<span>bias</span> · admin &nbsp;<a href="index.html" style="font-size:12px;">← back to site</a> &nbsp;<a href="#" onclick="doLogout();return false;" style="font-size:12px;">sign out</a></div>

  <h1>Post a trade</h1>
  <div class="panel">
    <div class="row3">
      <div><label>Date</label><input type="date" id="t_date"></div>
      <div><label>Ticker</label><input type="text" id="t_ticker" placeholder="TSLA" style="text-transform:uppercase;"></div>
      <div><label>Direction</label>
        <select id="t_dir"><option value="long">Long</option><option value="short">Short</option></select>
      </div>
    </div>
    <div class="row3">
      <div><label>Entry</label><input type="number" step="any" id="t_entry"></div>
      <div><label>Stop</label><input type="number" step="any" id="t_stop"></div>
      <div><label>Target (planned)</label><input type="number" step="any" id="t_target"></div>
    </div>
    <label>Exit (leave blank if still open)</label>
    <input type="number" step="any" id="t_exit">
    <label>Notes</label>
    <textarea id="t_notes" placeholder="Setup notes, structure, reasoning..."></textarea>
    <div class="rr-preview" id="rrPreview">Fill in entry/stop/target or exit to see R:R</div>
    <button class="btn" onclick="submitTrade()">Post trade</button>
    <div class="msg" id="tradeMsg"></div>
  </div>

  <h1>Post to watchlist</h1>
  <div class="panel">
    <div class="row2">
      <div><label>Date</label><input type="date" id="w_date"></div>
      <div><label>Ticker</label><input type="text" id="w_ticker" placeholder="NVDA" style="text-transform:uppercase;"></div>
    </div>
    <label>Note</label>
    <textarea id="w_note" placeholder="Why it's on the radar..."></textarea>
    <button class="btn" onclick="submitWatchlist()">Add to watchlist</button>
    <div class="msg" id="watchMsg"></div>
  </div>

  <h1>Your trades</h1>
  <div class="panel">
    <table>
      <thead><tr><th>Date</th><th>Ticker</th><th>Dir</th><th>Entry</th><th>Stop</th><th>Exit</th><th>R</th><th></th></tr></thead>
      <tbody id="tradeTableBody"></tbody>
    </table>
  </div>

  <h1>Watchlist entries</h1>
  <div class="panel">
    <table>
      <thead><tr><th>Date</th><th>Ticker</th><th>Note</th><th></th></tr></thead>
      <tbody id="watchTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ── 1. FILL THESE IN after creating your Supabase project ──
  const SUPABASE_URL = "https://hgespspgadbyhgcainlr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JRuw3y-lQ0YuzpwKxPyyIQ_5RbWQYu0";
  // ─────────────────────────────────────────────────────────

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('t_date').valueAsDate = new Date();
  document.getElementById('w_date').valueAsDate = new Date();

  async function checkSession(){
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadTrades();
      loadWatchlist();
    } else {
      document.getElementById('loginWrap').style.display = 'block';
      document.getElementById('app').style.display = 'none';
    }
  }
  checkSession();

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    const msg = document.getElementById('loginMsg');
    if (error){ msg.className='msg err'; msg.textContent = error.message; }
    else { checkSession(); }
  }
  async function doLogout(){
    await sb.auth.signOut();
    checkSession();
  }

  function calcR(direction, entry, stop, exitOrTarget){
    const risk = Math.abs(entry - stop);
    if (!risk || isNaN(exitOrTarget)) return null;
    const reward = direction === 'long' ? (exitOrTarget - entry) : (entry - exitOrTarget);
    return reward / risk;
  }

  function updateRRPreview(){
    const dir = document.getElementById('t_dir').value;
    const entry = parseFloat(document.getElementById('t_entry').value);
    const stop = parseFloat(document.getElementById('t_stop').value);
    const target = parseFloat(document.getElementById('t_target').value);
    const exit = parseFloat(document.getElementById('t_exit').value);
    const el = document.getElementById('rrPreview');
    let out = [];
    if (!isNaN(entry) && !isNaN(stop) && !isNaN(target)){
      const r = calcR(dir, entry, stop, target);
      if (r !== null) out.push(`Planned R:R — <b>${r.toFixed(2)}R</b>`);
    }
    if (!isNaN(entry) && !isNaN(stop) && !isNaN(exit)){
      const r = calcR(dir, entry, stop, exit);
      if (r !== null) out.push(`Actual result — <b>${r.toFixed(2)}R</b> (${r > 0 ? 'win' : r < 0 ? 'loss' : 'breakeven'})`);
    }
    el.innerHTML = out.length ? out.join(' &nbsp;|&nbsp; ') : 'Fill in entry/stop/target or exit to see R:R';
  }
  ['t_dir','t_entry','t_stop','t_target','t_exit'].forEach(id =>
    document.getElementById(id).addEventListener('input', updateRRPreview)
  );

  async function submitTrade(){
    const payload = {
      trade_date: document.getElementById('t_date').value,
      ticker: document.getElementById('t_ticker').value.trim().toUpperCase(),
      direction: document.getElementById('t_dir').value,
      entry: parseFloat(document.getElementById('t_entry').value),
      stop: parseFloat(document.getElementById('t_stop').value),
      target: document.getElementById('t_target').value ? parseFloat(document.getElementById('t_target').value) : null,
      exit: document.getElementById('t_exit').value ? parseFloat(document.getElementById('t_exit').value) : null,
      notes: document.getElementById('t_notes').value.trim() || null
    };
    const msg = document.getElementById('tradeMsg');
    if (!payload.ticker || isNaN(payload.entry) || isNaN(payload.stop)){
      msg.className='msg err'; msg.textContent='Ticker, entry, and stop are required.'; return;
    }
    const { error } = await sb.from('trades').insert(payload);
    if (error){ msg.className='msg err'; msg.textContent = error.message; return; }
    msg.className='msg ok'; msg.textContent='Trade posted.';
    document.getElementById('t_ticker').value='';
    document.getElementById('t_entry').value='';
    document.getElementById('t_stop').value='';
    document.getElementById('t_target').value='';
    document.getElementById('t_exit').value='';
    document.getElementById('t_notes').value='';
    updateRRPreview();
    loadTrades();
  }

  async function submitWatchlist(){
    const payload = {
      watch_date: document.getElementById('w_date').value,
      ticker: document.getElementById('w_ticker').value.trim().toUpperCase(),
      note: document.getElementById('w_note').value.trim() || null
    };
    const msg = document.getElementById('watchMsg');
    if (!payload.ticker){ msg.className='msg err'; msg.textContent='Ticker is required.'; return; }
    const { error } = await sb.from('watchlist').insert(payload);
    if (error){ msg.className='msg err'; msg.textContent = error.message; return; }
    msg.className='msg ok'; msg.textContent='Added to watchlist.';
    document.getElementById('w_ticker').value='';
    document.getElementById('w_note').value='';
    loadWatchlist();
  }

  async function loadTrades(){
    const { data, error } = await sb.from('trades').select('*').order('trade_date', { ascending: false }).limit(50);
    const body = document.getElementById('tradeTableBody');
    body.innerHTML = '';
    if (error || !data) return;
    data.forEach(t => {
      const r = t.exit != null ? calcR(t.direction, t.entry, t.stop, t.exit) : null;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${t.trade_date}</td><td>${t.ticker}</td>
        <td><span class="pill ${t.direction}">${t.direction}</span></td>
        <td>${t.entry}</td><td>${t.stop}</td><td>${t.exit ?? '—'}</td>
        <td>${r !== null ? r.toFixed(2)+'R' : '—'}</td>
        <td><button class="btn btn-danger" onclick="deleteTrade('${t.id}')">delete</button></td>`;
      body.appendChild(tr);
    });
  }

  async function deleteTrade(id){
    if (!confirm('Delete this trade?')) return;
    await sb.from('trades').delete().eq('id', id);
    loadTrades();
  }

  async function loadWatchlist(){
    const { data, error } = await sb.from('watchlist').select('*').order('watch_date', { ascending: false }).limit(50);
    const body = document.getElementById('watchTableBody');
    body.innerHTML = '';
    if (error || !data) return;
    data.forEach(w => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${w.watch_date}</td><td>${w.ticker}</td><td>${w.note ?? ''}</td>
        <td><button class="btn btn-danger" onclick="deleteWatch('${w.id}')">delete</button></td>`;
      body.appendChild(tr);
    });
  }

  async function deleteWatch(id){
    if (!confirm('Delete this watchlist entry?')) return;
    await sb.from('watchlist').delete().eq('id', id);
    loadWatchlist();
  }
</script>
</body>
</html>
